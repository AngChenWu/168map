    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #12687c 50%, #51a898); }

        /* --- SVG 地圖樣式 --- */
        #interactive-map {
            width: 100%;
            height: 100%;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            object-fit: contain;
        }

        .map-area {
            fill: #4c7cff;
            opacity: 0.0; /* 讓底圖 JPG 顯示出來 */
            stroke: #ffffff;
            stroke-width: 15; /* 在大座標系下增加描邊寬度 */
            transition: opacity 0.3s, stroke-width 0.3s;
            cursor: pointer;
            pointer-events: all; 
        }

        .map-area:hover {
            opacity: 0.3;
            stroke: #ffc107;
            stroke-width: 30;
        }

        .map-area.selected {
            opacity: 0.35;
            fill: #065f46; /* 深綠色，具透明度 */
            stroke: #064e3b;
            stroke-width: 25;
        }

        /* --- Dialog/Modal 樣式 (僅用於行動版) --- */
        .dialog-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .dialog-modal.visible {
            opacity: 1;
            visibility: visible;
        }

        .content-description p {
            margin-bottom: 1rem;
            line-height: 1.6;
            color: #4b5563;
        }
        
        #content-panel {
            overflow-y: auto; 
        }

        /* Tooltip（桌機顯示，小螢幕不顯示） */
        #tooltip {
            position: fixed;
            background-color: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 50;
        }

        @media (max-width: 1023px) {
            /* 手機上隱藏 Tooltip，由 JS 判斷只在桌機啟用 */
            #tooltip {
                display: none;
            }
        }

        /* 草地動畫區塊（使用提供的 SVG 草圖） */
        .grass-container {
            width: 100%;
            height: 50px;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            justify-content: flex-end;
        }

        .grass-svg {
            height: 100%;
            width: auto;
            max-width: none;
            transform-origin: bottom right;
            animation: grass-skew 2s infinite alternate ease-in-out;
        }

        @keyframes grass-skew {
            0% { transform: skewX(-12deg); }
            100% { transform: skewX(12deg); }
        }

        /* 主要內容置於草地上方 */
        .page-root {
            position: relative;
            z-index: 1;
        }

        @media (min-width: 1024px) {
            /* 寬螢幕時限制地圖容器高度，避免地圖跑出白框 */
            #map-wrapper {
                height: 80vh;
                max-height: 80vh;
                overflow: hidden;
            }
        }

        /* 讓左右兩側高度一致 */
        .layout-container {
            display: flex;
            align-items: stretch;
            height: 100%;
        }

        #map-wrapper,
        #detail-panel {
            flex: 1 1 0;
        }
    </style>

            return window.innerWidth < 1024;

        // 依據多邊形自動計算 viewBox 並產生右側/對話框中的放大地圖
        function buildZoomSvg(areaId) {
            const polygon = document.getElementById(areaId);
            if (!polygon) return '';

            const bbox = polygon.getBBox();
            const padding = 150; // 放大區域邊界留一點緩衝
            const viewBox = `${bbox.x - padding} ${bbox.y - padding} ${bbox.width + padding * 2} ${bbox.height + padding * 2}`;

            return `
                <div class="mt-6 border-t pt-4">
                    <h4 class="text-lg font-semibold mb-3 text-gray-700">區域放大圖</h4>
                    <svg viewBox="${viewBox}" class="w-full max-h-64 md:max-h-80 mx-auto rounded-lg shadow-md border border-gray-200 bg-white" xmlns="http://www.w3.org/2000/svg">
                        <!-- 底圖 -->
                        <image href="${BASE_MAP_URL}" x="0" y="0" width="7107" height="9922" preserveAspectRatio="none" />
                        <!-- 使用 mask 讓其他區域變暗，選取區域保留 -->
                        <mask id="mask-${areaId}">
                            <rect x="0" y="0" width="7107" height="9922" fill="white" />
                            <use href="#${areaId}" fill="black" />
                        </mask>
                        <rect x="0" y="0" width="7107" height="9922" fill="black" opacity="0" mask="url(#mask-${areaId})" />
                        <!-- 選取區域描邊 -->
                        <use href="#${areaId}" style="fill:none; stroke:#064e3b; stroke-width:20;"></use>
                    </svg>
                </div>`;
        }

        // 顯示內容
        function showContent(areaId) {
            const data = areaData[areaId];
            if (!data) return;

            const zoomSvgHtml = buildZoomSvg(areaId);

            const fullContentHtml = `
                <h3 class="text-xl font-semibold text-gray-700 mb-4 border-b pb-2">${data.title}</h3>
                <div class="content-description">${data.content}</div>
                ${zoomSvgHtml}
            `;

            if (isMobile()) {
                dialogTitle.textContent = data.title;
                dialogTableContent.innerHTML = data.content + buildZoomSvg(areaId);
                dialogModal.classList.add('visible');
                tooltip.classList.add('hidden');
            } else {
                panelContent.innerHTML = fullContentHtml;
                contentPanel.scrollTop = 0;
            }
        }

        function closeDialog() {
            dialogModal.classList.remove('visible');
        }

        function updateTooltipPosition(event) {
            tooltip.style.left = `${event.clientX + 10}px`;
            tooltip.style.top = `${event.clientY + 10}px`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const areas = mapContainer.querySelectorAll('.map-area');

            areas.forEach(area => {
                const areaName = area.getAttribute('data-name');
                const areaId = area.id;

                // 點擊：標示選取 + 顯示內容
                const handleSelect = () => {
                    if (currentSelectedArea) currentSelectedArea.classList.remove('selected');
                    area.classList.add('selected');
                    currentSelectedArea = area;
                    showContent(areaId);
                };

                area.addEventListener('click', handleSelect);
                area.addEventListener('touchend', handleSelect);

                // hover 顯示 tooltip（桌面版）
                area.addEventListener('mouseover', (event) => {
                    if (!isMobile()) {
                        tooltip.textContent = areaName;
                        tooltip.classList.remove('hidden');
                        tooltip.style.opacity = '1';
                        updateTooltipPosition(event);
                    }
                });

                area.addEventListener('mousemove', (event) => {
                    if (!isMobile()) updateTooltipPosition(event);
                });

                area.addEventListener('mouseout', () => {
                    if (!isMobile()) {
                        tooltip.style.opacity = '0';
                        tooltip.classList.add('hidden');
                    }
                });
            });

            // 點擊對話框外區域關閉
            dialogModal.addEventListener('click', (event) => {
                if (event.target === dialogModal) closeDialog();
            });
        });
    </script>
